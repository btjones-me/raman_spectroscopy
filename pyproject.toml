[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "czts-raman-analysis"
version = "0.1.0"
description = "Reproducible baseline correction and Lorentzian peak fitting for Raman spectra"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Benjamin Jones"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "PeakUtils>=1.3.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
raman-analyse = "raman_spectroscopy.cli:main"

[project.urls]
Repository = "https://github.com/btjones-me/raman_spectroscopy"
Issues = "https://github.com/btjones-me/raman_spectroscopy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/raman_spectroscopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
