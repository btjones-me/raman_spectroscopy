name: Research workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Run all bundled spectra
        run: raman-analyse "Raman Spectroscopy/CZTS_data" --output results --no-plots
      - name: Execute quick-start notebook
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -c "import nbformat; from nbclient import NotebookClient; NotebookClient(nbformat.read('notebooks/quickstart.ipynb', as_version=4), timeout=120, kernel_name='python3').execute()"
